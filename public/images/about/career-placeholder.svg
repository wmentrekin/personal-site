  <text x="165" y="250" fill="#dfedff" font-size="42" font-family="Arial, sans-serif" font-weight="700">CAREER PLACEHOLDER</text>
  <text x="165" y="306" fill="#c8dbf4" font-size="30" font-family="Arial, sans-serif">Replace with company logo (e.g., CapTech) or office/city image</text>
  <rect x="165" y="360" width="240" height="36" fill="#1f3e62" />
