<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Career Placeholder</title>
  <desc id="desc">Placeholder artwork for the career section.</desc>
  <defs>
    <linearGradient id="careerbg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#24476d" />
      <stop offset="100%" stop-color="#12263f" />
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#careerbg)" />
