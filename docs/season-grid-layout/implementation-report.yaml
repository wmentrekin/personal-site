review_summary:
  status: complete
  cycles: 2
  key_findings:
    - severity: must_fix
      finding: "Pinned bar was position:sticky in normal flow; showing it moved the thead whose position decides visibility -> flip-flop across a 30px band, scroll anchoring shifting scrollY +-30px per toggle. Reproduced by execution."
      resolution: "Zero-height sticky anchor with the bar absolute inside it (fd84050). Re-verified: 0/41 mismatches both directions, one transition, pinned at every depth incl. page bottom."
    - severity: should_fix
      finding: "Corner overlay 9.6px narrower than the cell it covers; cloned text peeked through."
      resolution: "padding matched (d425308); edge 218.50 == cell."
    - severity: should_fix
      finding: "Conference band shrank 12px -> 10.88px via specificity after the ID was dropped from the shared cell rule."
      resolution: "Restored to 12px; four stale comments citing the removed rule updated."
    - severity: should_fix
      finding: "100vw breakout at <=640 overflowed on classic-scrollbar browsers."
      resolution: "width:auto; margin-inline:-1.4rem; plus min-width:0 (implicit grid item) found necessary by measurement -- without it the section blew out to 2118px at 390."
    - severity: should_fix
      finding: "prefers-reduced-motion ignored by the arrows; window listeners accumulated across View Transitions; clone table not aria-hidden."
      resolution: "CSS scroll-behavior with the reduced-motion override; AbortController on astro:before-swap; aria-hidden on the clone viewport only."
    - severity: should_fix
      finding: "Cycle 2: the focus-handoff nit fix set tabindex=-1 on the shell, removing it from the Tab order after one use -- grid unreachable by keyboard with the default 2026 season."
      resolution: "Permanent tabindex=0 + role=region + aria-label on the shell; focus({preventScroll:true}) (3118cd9 pre-rewrite). Verified with real CDP key events."
  posted_to_pr: true

