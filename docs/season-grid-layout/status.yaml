decisions:
  - id: D1
    decision: "Mode = bounded-feature."
    rationale: "Coupled markup, CSS and JS changes across three components with a hard requirement (pinned header) that needs a sync mechanism and pixel-measured verification."
  - id: D2
    decision: "Desktop column widths stay 12rem/6rem."
    rationale: "Mockup at 5.5rem clipped scores; the site's own comment records 14 clipped cells even at 6rem."
  - id: D3
    decision: "Pinned header = a sibling element outside the horizontal scroller, sticky to the page, scrollLeft-synced."
    rationale: "Any non-visible overflow on an ancestor captures position:sticky in both axes, so a header inside the scroller can never pin to the window."

