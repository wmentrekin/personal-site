objective: >-
  Rework the CFB rankings page so the glass card is a control bar only (selectors + toggle, no
  title) with each tab's content rendered below it: the rankings table centered in its own card
  in the 1200px column; the Season Grid full-height on the page (no inner scroll box), breaking
  out of the column to the page edge, with the column header pinned to the window and the team
  column sticky. Desktop column widths unchanged; phone team column narrowed so three weeks fit.
  Design approved: https://claude.ai/code/artifact/b2460d25-2f88-49ba-af5e-6ba0e6538d00

