artifact: task_handoff
feature: "resume-org-logos-2026-08"
mode: "bounded-feature"
execution_batch_id: "1"
task_id: "logo-integration"
assigned_domain: "frontend-engineer"
branch: "home-layout-reorder-2026-08"
owner_skill: work

objective: >
  Wire the already-downloaded org/school logo images into (1) every card on the resume
  timeline page and (2) a redesigned Resume tile on the home page.

why_this_matters: >
  The repo owner wants their resume timeline to visually credit each company/school with
  its real logo instead of being pure text, and wants the home page's Resume tile
  refreshed to preview 2 of those logos (CapTech + Georgia Tech) as a small overlapping
  badge cluster, replacing the current dot-spine widget. This is a follow-up feature on
  top of already-shipped, already-verified work in the same PR -- the timeline's
  uniform-slot card layout and overlap-bug fix are done and must not regress.

inputs:
  requirements: null
  plan: null
  implementation_report: "docs/resume-org-logos-2026-08/implementation-report.yaml"
  relevant_paths:
    - "src/pages/resume.astro"
    - "src/pages/index.astro"
    - "public/images/resume-logos/"

scope:
  owned:
    - "src/pages/resume.astro"
    - "src/pages/index.astro"
  forbidden:
    - "any other page or component"
    - "opening a new branch or PR (stay on home-layout-reorder-2026-08 / PR #8)"
    - "downloading, replacing, or re-sourcing any logo file -- the 8 files in
       public/images/resume-logos/ are final, already spot-checked, and already approved
       by the repo owner; use them as-is"

implementation_notes:
  - "Logo assets already exist at public/images/resume-logos/ (served at /images/resume-logos/<file>
     since it's under public/): cbhs.svg, georgia-tech.svg, printpack.png, code-ninjas.svg,
     assurant.png, captech.jpg, great-neck-tools.jpg, weadmit.jpg. All 8 were visually
     spot-checked inside a light rounded chip badge and read cleanly."
  - "Org -> logo file mapping for the `timeline` array in resume.astro (add a `logo` field to
     the TimelineEntry type, e.g. `logo?: string`, holding the public path):
       Christian Brothers High School -> /images/resume-logos/cbhs.svg
       Georgia Institute of Technology (both the B.S. entry and the M.S. entry) -> /images/resume-logos/georgia-tech.svg
       WeAdmit Technologies, Inc. -> /images/resume-logos/weadmit.jpg
       Printpack -> /images/resume-logos/printpack.png
       Code Ninjas -> /images/resume-logos/code-ninjas.svg
       Assurant -> /images/resume-logos/assurant.png
       CapTech Consulting AND CapTech (all 3 CapTech entries: the Data Analytics Intern one,
         the Associate Data Engineering Consultant one, and the current Data Engineering
         Consultant one) -> /images/resume-logos/captech.jpg
       Great Neck Tools -> /images/resume-logos/great-neck-tools.jpg
     Every entry in the array should get a `logo` value -- there are no orgs without one."
  - "Card badge treatment: render each logo inside a small rounded-square chip
     (~36-40px, matching the CBHS/Georgia Tech legibility note above -- their logos are
     horizontal icon+wordmark lockups and get mushy below ~32px) with a light background
     (e.g. a very light neutral like #f5f5f0 or var if the design system already has a
     light-neutral token -- check BaseLayout's CSS custom properties first) and
     object-fit: contain with a couple px of internal padding, since the 8 source images
     have mixed backgrounds (transparent PNG/SVG vs. flat white vs. flat brand-color) --
     the light chip is what makes all 8 read consistently regardless of source background.
     This mirrors how LinkedIn/job-board 'worked at' logo badges are conventionally done."
  - "Placement on the desktop .gantt-card (src/pages/resume.astro): add the logo chip as
     part of the card's header row, next to or above the range/title text -- your call on
     exact placement (e.g. top-right corner, or inline before the org name), but it MUST
     NOT break the uniform SLOT_HEIGHT=160/SLOT_GAP=34 layout that was just fixed (an
     overlap bug from a box-sizing mismatch was fixed in the immediately preceding commit
     on this branch -- re-verify no regression of that fix, i.e. every card's rendered
     height must stay exactly 160px and gaps exactly 34px after your change). Do not let
     the logo chip force any card to grow past its fixed height."
  - "Placement on the mobile .mobile-content (same file, the <ol class='timeline-mobile'>
     block): mobile cards have natural/flow height already (no fixed height to break), so
     more layout freedom there -- add the same logo chip treatment for consistency."
  - "Home page Resume tile (src/pages/index.astro, .tile-resume / .resume-spine): replace
     the current 4-dot connected-spine widget with a small overlapping 2-logo badge
     cluster using ONLY the CapTech and Georgia Tech logos (/images/resume-logos/captech.jpg
     and /images/resume-logos/georgia-tech.svg) -- e.g. two small rounded chips offset
     diagonally/overlapping each other, similar spirit to a 'stacked avatar' UI pattern.
     This was the repo owner's explicit pick from a set of 5 pitched design directions
     (pitch #3, 'logo cluster teaser'). Keep the tile's existing 'Resume' / 'career
     timeline' text content and its glass-card/link-tile styling -- only the icon widget
     changes, not the tile's overall size/grid placement/behavior as a link."
  - "Keep all existing timeline data (dates, titles, orgs, descriptions, current/upcoming
     status, the CapTech promotion node-and-line connector) untouched -- this is additive
     (a `logo` field + badge markup/CSS), not a content or connector-logic change."

success_criteria:
  - "Every entry in both the Work and Education columns on /resume shows its real org/school
     logo in a legible, consistently-styled chip."
  - "No regression: every gantt-card is still exactly 160px tall with exactly 34px gaps
     between cards in both columns, and the CapTech promotion connector still renders
     correctly between the Associate Data Engineering Consultant and Data Engineering
     Consultant cards."
  - "Mobile timeline view also shows each entry's logo."
  - "The home page Resume tile shows an overlapping CapTech + Georgia Tech badge cluster
     instead of the dot-spine widget, and is still a working link to /resume with its
     existing text content intact."
  - "npm run build succeeds with no Astro/TS errors."

validation_expected:
  - "npm run build, then inspect dist output to confirm no build errors and that logo
     <img> tags/paths are present for every entry."
  - "Start the dev server and actually look at both /resume (desktop width, then a mobile
     viewport width e.g. via resize) and / (home page, Resume tile) in a real browser --
     this environment has Chrome browser automation tools (mcp__claude-in-chrome__*)
     available via the claude-in-chrome skill; use them to screenshot both pages and
     confirm logos render, are legible, aren't stretched/distorted, and that the uniform
     card height/gap and CapTech connector are visually intact. Do not skip this --
     screenshot-based visual verification is expected and available in this environment,
     unlike some other tasks where it wasn't."
  - "Specifically re-measure (via a quick devtools JS check, same technique as the prior
     overlap-bug fix: getBoundingClientRect() on .gantt-card elements) that every card
     is still 160px tall and every gap is still 34px, to prove no regression."

output_format:
  sections:
    - Changes
    - Local Validation
    - Blockers
    - Notes

escalate_if:
  - missing_context
  - conflicting_artifacts
  - product_or_architecture_guess_required
  - scope_expansion_required
