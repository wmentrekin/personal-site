artifact: plan
feature: "design-handoff-mobile-2026-08"
mode: "large-initiative"
status: draft
owner_skill: work
based_on: "docs/design-handoff-mobile-2026-08/requirements.yaml"

objective: "Implement the mobile-design handoff: real phone-tier responsiveness across the existing site, 4 new scaffolded project pages, a resynced Projects hub, and 5 new Home-tile live-preview widgets -- all translated from the mockup zip onto the site's real components and class names."

approach:
  summary: "Five sequential batches on a single branch, all frontend-engineer (no other domain fits a static-site CSS/client-JS feature, so the worktree-parallelization rule doesn't apply here per branch-and-pr-workflow.md). Order: new pages first (so the hub has real targets to link to), then the hub resync, then mobile-responsiveness CSS on existing pages, then Home's mobile grid fix, then Home's live-preview widgets last (highest-risk/newest behavior, isolated for easier review)."
  key_decisions:
    - "Rankings table stacked-card mobile pattern is explicitly OUT of scope (deferred to the future Rankings table styling session) -- no task touches RankingsTable.astro."
    - "Travel gets a basic mobile pass despite no provided mockup -- scoped narrowly (globe stage sizing, touch-friendly drag) to avoid over-building against an undefined design."
    - "Home page split into two tasks (grid/breakpoint fix, then widgets) rather than one, because the widgets are net-new JS behavior with real failure modes (perf, a11y, prefers-reduced-motion) that deserve isolated validation separate from the mechanical class-name remapping."
    - "New project pages (T1) are sequenced before the hub resync (T2) since T2 needs real pageHref targets to link to."

contracts:
  interfaces: []
  schemas: []
  config_changes:
    - "src/pages/projects/index.astro: projects[] array -- 4 pageHref values change from null to real paths; grid order and copy fields updated."
    - "No changes to any data schema, R2 artifact format, or build config."

branching:
  strategy: "single-branch"
  branch_name: "work/design-handoff-mobile-2026-08"
  worktrees: []

execution_batches:
  - id: "B1"
    goal: "Scaffold the 4 new project pages so the Projects hub has real link targets"
    tasks:
      - id: "T1"
        title: "Create 4 new project pages (agent-skills, chronicle, cbb-rankings, grizzlies-asset-lineage)"
        objective: "Create src/pages/projects/agent-skills.astro, chronicle.astro, cbb-rankings.astro, grizzlies-asset-lineage.astro, following the existing project-hero page pattern (see src/pages/projects/cfb-rankings.astro and 2020-election-model.astro for the real structural/CSS pattern to reuse -- BaseLayout, hero, kicker/description/tags/status/repo-link). Source each page's title/kicker/description/tags/status/repo-link content from the corresponding mockup file in the unzipped handoff (agent-skills.html, chronicle.html, cbb-rankings.html, grizzlies-asset-lineage.html), including the 'still under construction' status card each one ships with. Do NOT copy the mockup's back-link href literally (it points to a mockup-only preview file that doesn't exist) -- link back to /projects/ using the site's real navigation pattern. Do not invent content beyond what the mockups specify."
        assigned_domain: "frontend-engineer"
        owned_scope:
          - "src/pages/projects/agent-skills.astro"
          - "src/pages/projects/chronicle.astro"
          - "src/pages/projects/cbb-rankings.astro"
          - "src/pages/projects/grizzlies-asset-lineage.astro"
        forbidden_scope:
          - "src/pages/projects/index.astro"
          - "src/components/RankingsTable.astro"
        dependencies: []
        parallelizable: false
        expected_validation:
          - "npm run build succeeds and includes all 4 new page routes."
          - "Each new page visually follows the existing project-hero pattern (same BaseLayout usage, same hero/card structure as cfb-rankings.astro) -- confirmed via source diff comparison, not live browser (no browser available to this agent)."
          - "npx astro check shows 0 new errors."

  - id: "B2"
    goal: "Resync the Projects hub to the new grid order, copy, and real page links"
    tasks:
      - id: "T2"
        title: "Update projects/index.astro: reorder grid, resync copy, link new pages, add mark slots, extend clickability"
        objective: "Update src/pages/projects/index.astro's projects[] data array and grid layout to match the mockup's projects.html: reorder to CFB/Agent Skills, Grizzlies/Chronicle, CBB/2020 Election; set the 4 previously-null pageHref values to the new pages created in T1; add bordered logo-mark slots for Chronicle and Agent Skills (these stay visually EMPTY -- no source image exists, per requirements non-goals, do not create placeholder images); extend the existing full-card clickable-tile pattern (already implemented for CFB Rankings and 2020 Election Model, including this session's earlier z-index hover fix) to the newly-linked tiles. Preserve the existing hover-lift CSS behavior exactly as-is for tiles that already have it -- do not regress the z-index fix from earlier this session."
        assigned_domain: "frontend-engineer"
        owned_scope:
          - "src/pages/projects/index.astro"
        forbidden_scope:
          - "src/pages/projects/agent-skills.astro"
          - "src/pages/projects/chronicle.astro"
          - "src/pages/projects/cbb-rankings.astro"
          - "src/pages/projects/grizzlies-asset-lineage.astro"
          - "src/components/RankingsTable.astro"
        dependencies: ["T1"]
        parallelizable: false
        expected_validation:
          - "npm run build succeeds; all 6 project tiles link to real, working pages (no null pageHref remaining for the 4 new projects)."
          - "Diff-reviewed: the existing z-index:4 hover fix on .project-tile__inner (from earlier this session) is still present and unchanged."
          - "npx astro check shows 0 new errors."

  - id: "B3"
    goal: "Add phone-tier mobile responsiveness to existing non-Home pages"
    tasks:
      - id: "T3"
        title: "Mobile breakpoints for about, now, election-model, methodology, and cfb-rankings hero/panel"
        objective: "Add a phone-tier (~480px) responsive breakpoint plus 44px-minimum touch targets to: src/pages/about.astro, src/pages/now.astro, src/pages/projects/2020-election-model.astro, src/pages/projects/cfb-rankings/methodology.astro, and src/pages/projects/cfb-rankings.astro (hero/panel-head sections ONLY -- do not touch the rankings table's mobile behavior, that's explicitly deferred). Use the corresponding mockup file in the unzipped handoff (about.html, now.html, 2020-election-model.html, cfb-rankings-methodology.html, cfb-rankings.html) as the fidelity reference for exact breakpoint values and layout behavior, but write the CSS against each page's REAL existing class names (verified during discovery to already match content-wise -- these pages had no content changes, only new @media rules to add). methodology.astro's mockup has one leftover empty @media block -- sanity-check whether it implies a missing rule or is a genuine no-op before deciding whether methodology needs a mid-tier breakpoint beyond the existing 640px one."
        assigned_domain: "frontend-engineer"
        owned_scope:
          - "src/pages/about.astro"
          - "src/pages/now.astro"
          - "src/pages/projects/2020-election-model.astro"
          - "src/pages/projects/cfb-rankings/methodology.astro"
          - "src/pages/projects/cfb-rankings.astro"
        forbidden_scope:
          - "src/components/RankingsTable.astro"
          - "src/pages/index.astro"
        dependencies: []
        parallelizable: false
        expected_validation:
          - "npm run build succeeds; npx astro check shows 0 new errors."
          - "Each page has a working sub-820px AND sub-480px layout, confirmed via build output/DOM inspection (no live browser available to this agent -- note this limitation explicitly)."
          - "git diff confirms RankingsTable.astro and index.astro are untouched by this task."

      - id: "T4"
        title: "Basic mobile pass for travel.astro (no provided mockup)"
        objective: "Add a minimal, safe mobile pass to src/pages/travel.astro: appropriately-sized globe stage on small viewports, and touch-friendly pointer-drag interaction for the canvas globe if the current implementation's drag handling isn't already touch-compatible. No mockup exists for this page (user-confirmed decision) -- keep changes narrowly scoped and conservative rather than redesigning the page. Check whether the existing pointer/drag event handlers already use Pointer Events (touch-compatible) vs. mouse-only events as a first step."
        assigned_domain: "frontend-engineer"
        owned_scope:
          - "src/pages/travel.astro"
        forbidden_scope:
          - "src/components/RankingsTable.astro"
          - "src/pages/index.astro"
        dependencies: []
        parallelizable: false
        expected_validation:
          - "npm run build succeeds; npx astro check shows 0 new errors."
          - "Globe stage has a reasonable sub-480px size/layout; drag interaction confirmed touch-compatible via source inspection (Pointer Events or equivalent) if not already."

  - id: "B4"
    goal: "Fix Home page mobile grid (class-name remap from mockup, no widgets yet)"
    tasks:
      - id: "T5"
        title: "Remap mockup's .area-* mobile grid logic onto index.astro's real tile classes"
        objective: "Add phone-tier responsive grid behavior to src/pages/index.astro. The mockup's home.html uses invented .area-* classes for grid placement with its own @media resets -- translate that reset LOGIC onto the real classes: .intro-card, .tile-cfb, .tile-projects, .tile-about, .tile-now, .tile-travel, and the 2 unnamed .placeholder-tile elements. A literal selector copy of .area-* will do nothing since those classes don't exist in the real page -- confirm every real tile class is covered in the mobile reset (the mockup's own comment warns that a missed class produces phantom implicit grid tracks). Add 44px-minimum touch targets per the handoff's stated standard. This task does NOT include the 5 live-preview widgets (T6, next batch) -- grid/layout only."
        assigned_domain: "frontend-engineer"
        owned_scope:
          - "src/pages/index.astro"
        forbidden_scope:
          - "src/pages/projects/index.astro"
          - "src/pages/travel.astro"
          - "src/components/RankingsTable.astro"
        dependencies: []
        parallelizable: false
        expected_validation:
          - "npm run build succeeds; npx astro check shows 0 new errors."
          - "Every real tile class (.intro-card, .tile-cfb, .tile-projects, .tile-about, .tile-now, .tile-travel, both .placeholder-tile instances) is explicitly present in the new mobile breakpoint's CSS -- confirmed via grep/diff, not just visual inspection."

  - id: "B5"
    goal: "Add the 5 Home-tile live-preview widgets"
    tasks:
      - id: "T6"
        title: "Implement 5 live-preview widgets on Home page tiles"
        objective: "Add the 5 new interactive widgets to the relevant Home page tiles in src/pages/index.astro, per the mockup's home.html (used as a fidelity reference for behavior, not copied verbatim): a mini-globe on the Travel tile (reuse travel.astro's existing visited-countries data/rendering rather than writing new geo logic), a live clock, a network-sim animation, a fake terminal, and a typing-effect widget (map each to its corresponding tile per the mockup). Each widget must: run as client-side script/canvas only (site is static, no SSR), respect prefers-reduced-motion (skip/simplify animation when set), not block or delay initial page render (defer/lazy-init), and degrade gracefully (no unhandled JS errors) if its target element or its data isn't available for any reason."
        assigned_domain: "frontend-engineer"
        owned_scope:
          - "src/pages/index.astro"
        forbidden_scope:
          - "src/pages/travel.astro (read reference only, do not modify)"
          - "src/pages/projects/index.astro"
          - "src/components/RankingsTable.astro"
        dependencies: ["T5"]
        parallelizable: false
        expected_validation:
          - "npm run build succeeds; npx astro check shows 0 new errors."
          - "Source inspection confirms: prefers-reduced-motion is checked before starting any continuous animation; widget init is deferred/non-blocking; no widget throws if unmounted/missing data."
          - "git diff confirms travel.astro is unchanged (data/rendering reused via shared logic or duplicated snippet, not by modifying the Travel page itself)."

ordering_notes:
  - "Strict dependency chain: T1 -> T2 (hub needs real pages to link to). T5 -> T6 (widgets land on top of the already-fixed grid, avoiding two rounds of conflicting edits to the same file's mobile CSS)."
  - "T3, T4, and the T1->T2 chain touch entirely disjoint files from T5->T6 (Home) -- there's no file-overlap risk in running batches B1-B3 before B4-B5 sequentially on the single branch, this ordering is about clarity and easier incremental review, not merge-conflict avoidance."

risks:
  - "The 5 Home-tile widgets are the highest-risk item in this feature -- genuinely new client-side JS behavior (canvas/animation/timers) on the site's most-visited page. If review finds performance or stability concerns, the recommended fallback is to ship a subset (e.g. clock + typing effect, which are cheap) and defer the heavier ones (globe, network-sim canvas animations) rather than blocking the whole feature."
  - "No live browser is available to any agent in this session -- all responsive-layout validation is structural (source/CSS/build-output inspection), not visual. This should be stated plainly in the implementation report, and the user should do a real visual/device pass before considering Phase 2 fully closed out, same disclosure pattern used for the desktop design-handoff feature."

open_questions: []

review:
  status: draft
  loop_count: 0
  notes: []

checkpoint:
  required_before_execution: true
  status: pending
