artifact: requirements
feature: "design-handoff-mobile-2026-08"
mode: "large-initiative"
status: draft
owner_skill: work

summary:
  problem: "personal-site is desktop-only (no phone-tier breakpoints, no touch-target sizing anywhere) and the Projects hub has 4 dead placeholder tiles (Agent Skills, Chronicle, CBB Rankings, Grizzlies Asset Lineage) with no real pages behind them."
  motivation: "User ran a separate Claude design session and delivered a handoff zip (/Users/wentrekin/Downloads/Personal Site Design.zip: 12 HTML mockups + README) covering mobile responsiveness, 4 new project pages, a resynced Projects hub, and 5 new interactive 'live preview' widgets on the Home page tiles. This corresponds to Phase 2 of docs/roadmap-to-launch.md."
  requested_outcome: "Every page gets real mobile support (phone-tier breakpoint + 44px touch targets per the handoff's stated pattern), the 4 placeholder project pages become real (if minimal/under-construction) pages linked from the Projects hub, and the Home page gains its 5 live-preview widgets -- all implemented against the site's real components/class names, not copy-pasted from the mockup HTML."

goals:
  - "Add phone-tier (~480px) mobile breakpoints + 44px-minimum touch targets to: about.astro, now.astro, projects/2020-election-model.astro, projects/cfb-rankings/methodology.astro, projects/cfb-rankings.astro (hero/panel only, NOT the rankings table itself), and index.astro (Home grid)."
  - "Give travel.astro a basic mobile pass (globe stage sizing, touch-friendly pointer-drag) even though the handoff provided no explicit design for it -- user confirmed this is in scope, using judgment since no mockup exists."
  - "Scaffold 4 new pages under src/pages/projects/ (agent-skills, chronicle, cbb-rankings, grizzlies-asset-lineage), following the existing project-hero pattern (see cfb-rankings.astro), each with an explicit 'still under construction' status card as shipped in the mockups."
  - "Update projects/index.astro: reorder the grid to match the mockup, resync tile copy, link the 4 new pageHref values, add bordered logo-mark slots (Chronicle/Agent Skills marks stay visually empty -- no source image exists yet), extend full-card clickability to the newly-linked tiles."
  - "Implement 5 new lightweight live-preview widgets on Home page tiles: mini-globe (reuse travel.astro's visited-countries data/rendering), live clock, network-sim animation, fake terminal, typing effect -- as real client-side behavior (script/client island), following the mockup's home.html as a fidelity reference, not a literal copy."
  - "Map the mockup's invented .area-* mobile-reset class names onto the real index.astro classes (.intro-card, .tile-cfb, .tile-projects, .tile-about, .tile-now, .tile-travel, and the 2 unnamed .placeholder-tile elements) -- a naive selector copy would silently do nothing."

non_goals:
  - "The Rankings table 'stacked card' mobile pattern (rows -> cards under 600px) shown in the mockup's cfb-rankings.html -- explicitly deferred by user decision to the separate, already-planned Rankings table styling session (docs/roadmap-to-launch.md Phase 1). RankingsTable.astro is NOT touched by this feature. The table keeps its current horizontal-scroll behavior on mobile for now."
  - "Sourcing/creating new logo-mark images for Chronicle or Agent Skills -- those slots ship visually empty per the mockup's own README."
  - "Building out real content for the 4 new project pages beyond the mockup's placeholder/under-construction copy -- these are scaffolds, not finished project writeups."
  - "Any content or copy changes beyond what the mockups specify (no proactive rewriting of existing page copy)."

constraints:
  technical:
    - "Site is Astro 5, output: 'static', no adapter/SSR -- any new widget behavior must be pure client-side JS/CSS (script tags, no server logic)."
    - "The mockup zip is design-reference-only per its own README ('recreate this behavior inside the existing Astro components... not by importing these HTML files wholesale') -- implementation must translate to real repo class names/component structure, not copy mockup HTML/CSS verbatim."
    - "Mockup's .area-* grid-placement classes on the Home page do not exist in the real index.astro (which uses .intro-card/.tile-cfb/etc. directly) -- must be explicitly re-mapped."
    - "No new breakpoint tier currently exists below ~820px anywhere in the codebase; the mockup's README calls for a consistent phone-tier pattern (44px touch targets) across pages -- this is genuinely new, not an extension of an existing pattern."
    - "The 4 new project pages need no real backing data/content system -- they are static placeholder pages, consistent with the existing project-hero page pattern."
    - "New Home-tile widgets must respect prefers-reduced-motion and not block/delay page render (canvas/animation work should be lightweight, deferred, or paused when not visible)."
  product:
    - "Rankings table mobile stacking explicitly deferred (user decision, 2026-08-14) -- do not touch RankingsTable.astro's mobile behavior in this feature."
    - "Travel page mobile pass is in scope despite having no provided mockup (user decision, 2026-08-14) -- use reasonable judgment, keep changes minimal and safe given the absence of a design reference."
  process:
    - "Single branch (work/design-handoff-mobile-2026-08), sequential execution -- all tasks route to frontend-engineer (no other domain fits an Astro/CSS/client-JS site redesign), so the worktree-parallelization rule in branch-and-pr-workflow.md doesn't apply (it requires different assigned_domain values per parallel task)."
    - "One integration PR for the whole feature, per standard branch-and-pr-workflow.md."

assumptions:
  - "The 4 new project pages' 'under construction' framing is acceptable to ship publicly (they're linked from the Projects hub, which is a live, indexed page) -- flagged as worth a final visual confirmation from the user before merge, but not blocking execution."
  - "Reusing travel.astro's existing globe-rendering code for the Home-tile mini-globe widget (rather than writing new geo-rendering logic) is preferred, per the mockup's own README note that it uses 'the same visited-countries data as the full Travel page globe.'"

