research:
  repo_findings:
    - "repo-researcher discovery (2026-08-14): handoff zip is 12 standalone HTML+CSS+JS mockups + README, no image assets, no Figma export -- same format as the completed desktop handoff."
    - "3 distinct work areas in the zip: (1) mobile responsive fixes on Home/About/Now/CFB-Rankings/Methodology/Election-model, (2) 5 new Home-tile live-preview widgets, (3) 4 new project pages + reordered/resynced Projects grid."
    - "Home page mockup uses invented .area-* classes for grid placement that do not exist in the real index.astro (.intro-card/.tile-cfb/.tile-projects/.tile-about/.tile-now/.tile-travel + 2 unnamed .placeholder-tile) -- must be explicitly re-mapped, not copied."
    - "RankingsTable.astro currently has zero mobile handling beyond overflow-x:auto + min-width:31rem (forces horizontal scroll) -- the stacked-card fix that would address this is explicitly deferred, not part of this feature."
    - "All 4 new project pages' PNG mark assets already exist in public/images/projects/hub/png-marks/ except Chronicle and Agent Skills, which ship with intentionally empty mark slots per the mockup README."
    - "Existing breakpoint inventory confirms desktop-only framing: BaseLayout.astro (820px only), index.astro (1140px/720px), about.astro (900px), now.astro (820px), travel.astro (900px, globe-stage min-height only), projects/index.astro (980px), projects/cfb-rankings.astro (920px/640px, no table handling), projects/2020-election-model.astro (940px), methodology.astro (640px, plus one leftover empty @media block in the mockup worth a quick sanity check, not necessarily a required change)."
  platform_findings: []

acceptance_criteria:
  - "npm run build succeeds with 0 errors after all batches; npx astro check shows 0 errors."
  - "Every existing page in scope (about, now, travel, cfb-rankings, methodology, 2020-election-model, index/Home) has a working sub-820px and sub-480px responsive layout -- verified via build output / DOM inspection (no live browser available to this session's agents; note this limitation explicitly in the implementation report)."
  - "The 4 new project pages exist, build cleanly, are reachable from the Projects hub's updated tiles, and follow the existing project-hero visual pattern."
  - "Projects hub reflects the mockup's reordered grid and resynced copy; the 3 already-linked tiles' existing hover/clickability behavior (fixed earlier this session) is not regressed."
  - "The 5 Home-tile widgets render without throwing JS errors, respect prefers-reduced-motion, and do not block initial page render."
  - "RankingsTable.astro is untouched (git diff shows no changes to this file) -- confirms the deferral decision was honored."

open_questions:
  - "Should the 4 new project pages' 'under construction' framing be reviewed by the user before merge, given they'll be live and indexed once merged? (Not blocking execution -- flagged for the PR description.)"

freeze:
  ready_for_plan: true
  blockers: []
