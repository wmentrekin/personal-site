artifact: plan
feature: "design-handoff-2026-08"
mode: "large-initiative"
status: draft
owner_skill: work
based_on: "docs/design-handoff-2026-08/requirements.yaml"

objective: "Implement the locked design handoff across 7 pages, including wiring the CFB Rankings page to real R2 data via a build-time fetch script, while keeping personal-site fully static and the R2 bucket fully private."

approach:
  summary: "Five tasks across two domains. A data-engineer task builds a small build-time fetch script that pulls the R2 rankings data down into public/data/cfb/ before each Astro build. Four frontend-engineer tasks apply the design handoff's page-level changes -- one bundling the four small polish pages, and three covering the CFB Rankings (data-consuming), Methodology, and 2020 Election Model reworks. The Rankings page task depends on the fetch script; everything else is independent and runs in parallel."
  key_decisions:
    - "R2 fetch script lives in the repo as a small Node script (not a new dependency-heavy pipeline) invoked before `astro build` -- e.g. `scripts/fetch-rankings-data.mjs`, wired via package.json (`\"prebuild\": \"node scripts/fetch-rankings-data.mjs\"` or equivalent), using the AWS SDK v3 S3 client against R2's S3-compatible endpoint with a read-only-scoped token from Cloudflare Pages build environment variables."
    - "Fetch script writes rankings/index.json and every season/week file it lists into public/data/cfb/ (e.g. public/data/cfb/index.json, public/data/cfb/{season}/week-{week}.json), superseding the old single-file public/data/cfb/latest-rankings.json (which gets deleted). Season/Week select filters are implemented as client-side JS reading these pre-baked static files -- no server route needed."
    - "Fetch script behavior: if R2 credentials are absent, warn and skip (leaves any existing public/data/cfb/ contents in place) so local `astro dev` still works without credentials, mirroring the graceful-degradation pattern already established in the sibling cfb-rankings repo's R2 code. If credentials ARE present but the fetch itself fails, exit non-zero so the Cloudflare Pages build fails loudly rather than silently shipping stale/missing data."
    - "Conference column is inserted at table position 3 (Rank, Team, Conference, Record, Rating, Delta) specifically so Team stays at column-index 2 -- this means RankingsTable.astro's existing `td:not(:nth-child(2))` mono-font CSS keeps working unmodified, no selector change needed, only the new column data itself."
    - "RankingsTable.astro's `.rank-col` color changes from `var(--accent-football)` to a neutral value (`var(--text)`, matching the design reference) as part of the Rankings-page task, since no other page currently consumes this shared component (re-verified at execution time before changing shared CSS)."
    - "No worktrees: despite the data-engineer/frontend-engineer domain split qualifying by the letter of the worktree criteria, total diff size across all 5 tasks is modest and every task's owned_scope is non-overlapping, so parallel agents work directly on the shared branch without merge risk -- consistent with how the sibling cfb-rankings repo's smaller mixed-domain batches were handled this session."

contracts:
  interfaces:
    - "scripts/fetch-rankings-data.mjs: reads R2_ACCOUNT_ID / R2_ACCESS_KEY_ID_READONLY / R2_SECRET_ACCESS_KEY_READONLY / R2_BUCKET_NAME from process.env; fetches rankings/index.json, then every {season}/week-{week}.json it lists; writes to public/data/cfb/index.json and public/data/cfb/{season}/week-{week}.json. No return value consumed by Astro -- purely a filesystem side effect that runs before `astro build`."
    - "cfb-rankings.astro frontmatter: reads public/data/cfb/index.json at build time (via readFileSync, same pattern as the current latest-rankings.json read) to get latest_season/latest_week for defaults and the full season/weeks list to populate the <select> options. Reads the specific public/data/cfb/{season}/week-{week}.json for the initially-rendered table (defaulting to latest_season/latest_week). A small inline <script> handles client-side season/week changes by fetching the appropriate already-deployed static JSON file (these are public static assets in the final build output, so a plain client fetch to /data/cfb/{season}/week-{week}.json works with no server involved) and re-rendering the table rows."
  schemas:
    - "Rankings table columns (RankingsTable headers/rows): ['Rank', 'Team', 'Conference', 'Record', 'Rating', 'Delta'] -- Conference sourced directly from each artifact row's `conference` field."
  config_changes:
    - "package.json: add a prebuild (or equivalent) script step invoking scripts/fetch-rankings-data.mjs; add @aws-sdk/client-s3 as a devDependency (build-time only, not shipped to the client)."
    - "Cloudflare Pages project (manual, user-provisioned): add build environment variables R2_ACCOUNT_ID, R2_ACCESS_KEY_ID_READONLY, R2_SECRET_ACCESS_KEY_READONLY, R2_BUCKET_NAME (a NEW read-only-scoped token, distinct from cfb-rankings' write token) and create a Deploy Hook for triggering rebuilds."
    - "public/data/cfb/latest-rankings.json is deleted, superseded by the fetch script's output structure."

branching:
  strategy: "single-branch"
  branch_name: "work/design-handoff-2026-08"
  worktrees: []

execution_batches:
  - id: "B1"
    goal: "Simple polish fixes: Home, About, Now, Projects hub"
    tasks:
      - id: "T1"
        title: "Apply polish fixes to Home, About, Now, and Projects hub"
        objective: "Apply only the REAL remaining changes identified in discovery (many README items are already no-ops in current code -- see requirements.yaml research findings, do not re-implement those). Home: remove the 'Featured' eyebrow (<p class=\"eyebrow accent-football\">Featured</p>) from the CFB tile. About: add missing :hover rules to .fact-card and .about-card (transition: transform 180ms ease, box-shadow 180ms ease; :hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); } -- reference the EXISTING global --shadow-hover token from BaseLayout.astro, do not redefine it locally); remove .hero-text's max-width: 42rem; confirm and apply the correct .about-shell padding-bottom value by checking the about.html design reference's literal computed value (README says '3.5rem' but is ambiguous vs. current 1.5rem -- resolve by inspection, not guessing). Now: remove .hero-text's max-width: 40rem. Projects hub: replace the current borderless project-mark-frame sizing with a uniform 3.4rem bordered chip (padding: .55rem; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.045)) across all 6 project tiles; add a :has(.project-mark-anchor) rule giving .tile-summary padding-right: 4.4rem when a card has a logo chip; remove the .footer-line divider markup and CSS from all 6 tiles; add missing .icon-link:hover (transform: translateY(-3px); box-shadow: var(--shadow-hover)). Additionally (user-approved stretch item): fix the Projects hub's keyboard-accessibility gap on the CFB Rankings and 2020 Election Model cards -- currently the .tile-overlay link and the nested .icon-link are two separate tab stops with no single 'whole card' focus target for keyboard users. Keep the existing working click/CSS-layering behavior for mouse users exactly as-is (do not reimplement with a JS click-handler); only add whatever minimal a11y improvement makes sense on top of it (e.g. ensure the .tile-overlay anchor has a clear, accurate aria-label -- already present per discovery -- and confirm tab order/focus-visible styling is sane). If a real fix here would require restructuring the click behavior itself, treat that as exceeding this task's bounded scope and escalate rather than expanding into a rework."
        assigned_domain: "frontend-engineer"
        owned_scope:
          - "src/pages/index.astro"
          - "src/pages/about.astro"
          - "src/pages/now.astro"
          - "src/pages/projects/index.astro"
        forbidden_scope:
          - "src/pages/projects/cfb-rankings.astro"
          - "src/pages/projects/cfb-rankings/methodology.astro"
          - "src/pages/projects/2020-election-model.astro"
          - "src/components/RankingsTable.astro"
          - "src/layouts/BaseLayout.astro"
        dependencies: []
        parallelizable: true
        expected_validation:
          - "Run the dev server and visually check all 4 pages against the corresponding design reference .html files (home.html, about.html, now.html, projects.html) at /private/tmp/claude-501/-Users-wentrekin-dev/11a7370c-3905-45f7-84e6-380c775dc6dd/scratchpad/design-handoff/design_handoff_site_updates/ -- confirm hover states, spacing, and the removed eyebrow/footer-lines visually match."
          - "Confirm the Projects hub's existing card-click-target behavior for CFB Rankings and 2020 Election Model tiles still works (click anywhere navigates, repo icon-link still independently clickable) -- a regression check, not new functionality."
  - id: "B2"
    goal: "Build-time R2 data fetch script"
    tasks:
      - id: "T2"
        title: "Build the R2 rankings data fetch script"
        objective: "Create scripts/fetch-rankings-data.mjs per contracts.interfaces above -- fetches rankings/index.json and every season/week artifact it lists from R2 (via @aws-sdk/client-s3 against the S3-compatible endpoint), writes them into public/data/cfb/. Graceful skip (warn, exit 0) if R2 env vars are absent; hard failure (exit non-zero) if credentials are present but the fetch fails. Wire it into package.json as a prebuild step. Delete the old public/data/cfb/latest-rankings.json (superseded)."
        assigned_domain: "data-engineer"
        owned_scope:
          - "scripts/fetch-rankings-data.mjs"
          - "package.json"
          - "public/data/cfb/latest-rankings.json (deletion only)"
        forbidden_scope:
          - "src/pages/"
          - "src/components/"
        dependencies: []
        parallelizable: true
        expected_validation:
          - "Run the script with no R2 env vars set and confirm it warns and exits 0 without creating/modifying any files."
          - "NOTE: real R2 read-only credentials do not exist yet in this environment (a new token needs to be provisioned by the user, per requirements.yaml's process constraints) -- if credentials are still absent at execution time, this task cannot validate the real-fetch path end-to-end. Report this plainly as a blocker/incomplete-validation rather than skipping silently; the orchestrator will coordinate with the user on provisioning, similar to the R2 write-token flow already completed in the sibling cfb-rankings repo this session."
  - id: "B3"
    goal: "CFB Rankings page rework + real data wiring"
    tasks:
      - id: "T3"
        title: "Rework cfb-rankings.astro and add Conference column to RankingsTable.astro"
        objective: "Per requirements.yaml and the cfb-rankings.html design reference: remove the Snapshot/Updated hero-aside bubbles, the colored link-card row (Methodology/GitHub/Streamlit -- including the Streamlit link entirely), and the Project Notes/Next Up info-grid cards. New header: back-link ('← Projects') + single hero glass-card containing kicker/title/description/tags plus a 'Methodology' bubble button and a small circular GitHub repo icon-link (top-right, inside the hero card). Below: 'Rankings' heading + Season/Week <select> filters (dark-themed, custom chevron background-image, matching cfb-rankings.html's .filter-select styling) + the full ratings table. Switch the data source from the old single-file readFileSync to reading public/data/cfb/index.json (for populating the season/week dropdowns and the default latest_season/latest_week) and public/data/cfb/{season}/week-{week}.json (for the initially-rendered table), per contracts.interfaces above. Add a small inline <script> so changing either <select> re-fetches the corresponding already-built static JSON file (a plain client-side fetch to the public path, no server involved) and re-renders the table rows client-side. Neutralize all --accent-football usage on this page to plain var(--text-soft)/var(--text) per the design reference. In RankingsTable.astro: add a Conference column at table position 3 (Rank, Team, Conference, Record, Rating, Delta -- placed here specifically so Team stays at column-index 2 and the existing td:not(:nth-child(2)) mono-font CSS needs no changes), and change .rank-col's color from var(--accent-football) to var(--text) (re-confirm no other page consumes RankingsTable before changing this shared CSS -- discovery found none, but verify fresh)."
        assigned_domain: "frontend-engineer"
        owned_scope:
          - "src/pages/projects/cfb-rankings.astro"
          - "src/components/RankingsTable.astro"
        forbidden_scope:
          - "src/pages/projects/cfb-rankings/methodology.astro"
          - "src/pages/projects/2020-election-model.astro"
          - "scripts/fetch-rankings-data.mjs"
        dependencies: ["T2"]
        parallelizable: false
        expected_validation:
          - "Run the dev server; if T2's fetch script successfully populated public/data/cfb/ with real data (or if not yet possible due to missing credentials, use manually-seeded sample files matching the real schema for this validation, and say so explicitly), confirm the table renders the full field for the default season/week, the Conference column displays correctly, and changing the Season/Week selects updates the table."
          - "Visually compare against cfb-rankings.html for header structure, hero card actions, filter styling, and confirm no colored accent remains anywhere on the page."
  - id: "B4"
    goal: "CFB Rankings Methodology page rework"
    tasks:
      - id: "T4"
        title: "Rework methodology.astro"
        objective: "Per requirements.yaml and cfb-rankings-methodology.html: remove the .method-toc sidebar entirely and its two-column grid (.method-doc becomes single-column, full-width); restructure the header to match the new Rankings-page pattern (back-link '← Rankings' as a sibling above the hero card, not nested inside it; hero card gets a 'Rankings' bubble button + GitHub repo icon-link in .hero-actions, replacing the current .link-card-row); tighten vertical rhythm using the exact before/after values captured in discovery (section spacing 2.4rem/1.5rem -> 1.3rem/1rem; body line-height 1.85 -> 1.5; paragraph/list margins per discovery's captured values; h2 clamp(1.8rem,3vw,2.3rem) -> clamp(1.4rem,2.4vw,1.75rem); h3 margin/size 1.25rem·1.02rem -> .8rem·.92rem; content padding 1.5rem -> 1.1rem 1.3rem; list-item margin-bottom .45rem -> .25rem) -- copy/content text itself is unchanged, only spacing/sizing; change .equation-block from the yellow-tinted panel (border/background using rgba(250,204,21,...)) to the neutral panel (border: 1px solid var(--line); background: rgba(255,255,255,.02)); neutralize .method-kicker's --accent-method (yellow) usage to plain var(--text-soft); add the currently-missing .glass-card:hover re-enable (currently actively cancelled via .method-content.glass-card:hover { transform: none } -- remove that cancellation) and add a new .icon-link + .icon-link:hover rule (none exists in this file currently, needed for the new GitHub icon-link in the header)."
        assigned_domain: "frontend-engineer"
        owned_scope:
          - "src/pages/projects/cfb-rankings/methodology.astro"
        forbidden_scope:
          - "src/pages/projects/cfb-rankings.astro"
          - "src/components/RankingsTable.astro"
        dependencies: []
        parallelizable: true
        expected_validation:
          - "Run the dev server, visually compare against cfb-rankings-methodology.html -- confirm no TOC sidebar, full-width single column, tightened spacing, neutral equation blocks, working hover states on the hero card and new GitHub icon-link."
          - "Cross-check the new header visually against T3's reworked cfb-rankings.astro header once both are done, for pattern consistency (same hero-card + bubble-button + icon-link structure) -- flag any inconsistency found rather than silently reconciling on your own if it requires a product/design judgment call."
  - id: "B5"
    goal: "2020 Election Model page rework"
    tasks:
      - id: "T5"
        title: "Rework 2020-election-model.astro"
        objective: "Per requirements.yaml and 2020-election-model.html: remove the colored link-card row (GitHub Repo/GitHub Pages Site/Back to Projects with tone-repo/tone-linkedin/tone-projects) below the header; add a new .hero-actions div inside the existing .hero-copy card containing a 'GitHub Pages Site' bubble button + a GitHub repo .icon-link (this is new structure, does not exist in the current file at all); remove the Methods/Results/Insights .section-links pill row and its CSS; remove .hero-text's max-width: 30rem so it wraps at container width -- do NOT copy the design reference's white-space:nowrap/overflow-x:auto treatment, that appears to be a preview-only artifact inconsistent with the stated intent (matching the About/Now fix). The existing map image (/images/projects/2020-election-model/map.png) is already correctly wired in and real (not a placeholder despite what the reference/README imply) -- leave that <img> block as-is, just carry it through the header/link-row restructuring untouched. The archive banner and hero-copy card structure otherwise stays as currently structured (only the header actions and link-row change)."
        assigned_domain: "frontend-engineer"
        owned_scope:
          - "src/pages/projects/2020-election-model.astro"
        forbidden_scope:
          - "src/pages/projects/cfb-rankings.astro"
          - "src/pages/projects/cfb-rankings/methodology.astro"
          - "public/images/projects/2020-election-model/"
        dependencies: []
        parallelizable: true
        expected_validation:
          - "Run the dev server, visually compare against 2020-election-model.html -- confirm the link-card row and pill-link row are gone, the new hero-actions (GitHub Pages Site + icon-link) render correctly, hero-text wraps at full width (no early wrap, no nowrap/horizontal-scroll), and the map image still renders correctly."

ordering_notes:
  - "T1 (polish), T2 (fetch script), T4 (methodology), T5 (election model) have no dependencies on each other and can run in parallel (4 simultaneous frontend/data-engineer agents, all non-overlapping owned_scope)."
  - "T3 (cfb-rankings.astro rework) depends on T2 completing first, since it consumes the fetch script's output file structure -- runs after T2 lands, in sequence."
  - "T4's header restructure should visually match T3's once both land -- flagged for a consistency check during verification, not a hard sequential dependency (both can be built against the shared spec in the README/reference HTML independently)."

risks:
  - "T2 cannot be fully validated end-to-end without real R2 read-only credentials, which do not exist yet -- this needs a provisioning step from the user (new Cloudflare API token, scoped Object Read only, on the same cfb-rankings bucket) before T3's data-rendering validation can be considered complete. Flagged explicitly rather than assumed away."
  - "The Cloudflare Pages build environment variables and Deploy Hook creation are manual, dashboard-only steps outside this feature's own execution scope (no agent can do them) -- required before the build-time fetch actually works in production, and before cfb-rankings' weekly-update.yml can be updated with the corresponding curl step (a small cross-repo follow-up in the sibling repo, not part of this feature)."
  - "Inserting a Conference column changes RankingsTable.astro, a shared component -- if any other page turns out to consume it (not found in discovery, but discovery is not infallible), this could cause an unintended visual change elsewhere. T3's validation explicitly re-checks this before implementing."

open_questions: []

