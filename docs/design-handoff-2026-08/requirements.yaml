artifact: requirements
feature: "design-handoff-2026-08"
mode: "large-initiative"
status: draft
owner_skill: work

summary:
  problem: "A locked design pass (from a separate Claude design session) specifies polish/consistency fixes across 4 pages plus a significant rework of the CFB Rankings + Methodology pages, including replacing the Rankings page's static 3-row sample data with the real ranking artifacts now published to Cloudflare R2 by the sibling cfb-rankings repo."
  motivation: "Complete this locked design pass before resuming the broader Streamlit-to-personal-site migration, per explicit user sequencing. It also happens to deliver the real data-wiring piece of that migration for the Rankings page specifically."
  requested_outcome: "All 7 pages match the design handoff's spec (README.md + 7 HTML references), the Rankings page renders real, filterable (season/week) data sourced from R2 at build time, and the site remains 100% static with the R2 bucket staying fully private."

goals:
  - "Apply the design handoff's polish fixes to Home, About, Now, and the Projects hub."
  - "Rework the CFB Rankings page: simplified header (single hero card + Methodology/GitHub actions), Season/Week select filters, full-field rankings table (including a Conference column, per user decision) sourced from real R2 data instead of a static 3-row sample."
  - "Rework the CFB Rankings Methodology page: remove the TOC sidebar, restructure the header to match the new Rankings page pattern, tighten vertical rhythm, neutralize equation-block coloring."
  - "Apply the 2020 Election Model page's presentation cleanup (link-row removal, header restructure)."
  - "Wire build-time R2 data fetching for the Rankings page without adding any new server-side infrastructure to the site (stays output: 'static')."
  - "Set up a Cloudflare Pages deploy hook so cfb-rankings' existing weekly publish automatically triggers a personal-site rebuild, keeping the Rankings page's data fresh on a weekly cadence."

non_goals:
  - "The rest of the Streamlit-to-personal-site migration beyond the Rankings page's data wiring (e.g. deprecating Streamlit itself, any further migration-scoped work in docs/cfb-site-migration/requirements.yaml in the sibling cfb-rankings repo) -- explicitly deferred, this feature is scoped to the design handoff only."
  - "Adding a server adapter (@astrojs/cloudflare) or any server-rendered/on-demand route -- ruled out by the user's explicit choice of build-time fetch over the Pages Functions + R2 binding option."
  - "Making the R2 bucket public in any way (r2.dev dev URL, custom domain) -- ruled out by the user's explicit choice."
  - "Redesigning pages/sections not named in the design handoff (e.g. Travel page -- explicitly out of scope per the handoff README itself)."
  - "Re-litigating README items that discovery found are already implemented in current code (see research findings below) -- treated as no-ops, not re-done."

constraints:
  technical:
    - "personal-site is currently 100% static (astro.config.mjs has no `output` field, no adapter installed, zero API routes, zero env-var usage anywhere in src/) -- this feature must not change that. R2 data is fetched at build time only."
    - "personal-site deploys via Cloudflare Pages' native git-connected build (confirmed: no .github/workflows/, no wrangler.toml, plain `astro build` script) -- NOT via GitHub Actions. Build-time R2 credentials must be added as Cloudflare Pages project environment variables, not a GitHub secret."
    - "The R2 API token used by personal-site's build must be a SEPARATE, read-only-scoped token from the write-scoped token cfb-rankings already uses -- least privilege, and provisioned specifically for this purpose."
    - "RankingsTable.astro is a shared, generic component (headers: string[], rows: Array<Array<string|number>>) -- adding a Conference column requires careful placement, since existing CSS (`td:not(:nth-child(2))` for mono-font styling) assumes column index 2 is 'Team'. Conference must be placed so the mono-font targeting still lands on the intended columns after the new column is inserted. Also: `.rank-col` currently hardcodes `var(--accent-football)` and must be neutralized to match the design handoff's 'no colored accents on CFB pages' direction -- confirm no other page consumes RankingsTable before changing this shared CSS (none found in discovery, but must be re-checked at implementation time)."
    - "Every R2 season/week combination that exists (per rankings/index.json, all 15 weeks of 2025 currently) should be fetched and baked into the static build at build time (e.g. into public/data/cfb/), with season/week filtering implemented as client-side JS swapping which pre-baked dataset populates the table -- no per-request fetching, since the site has no server route to do that from."
  product:
    - "Rankings table columns: Rank / Team / Conference / Record / Rating / Delta (Conference added per explicit user decision, even though the locked design reference itself only shows Rank/Team/Record/Rating/Delta)."
    - "Design handoff's neutral (non-colorful) direction for CFB/election pages must be preserved -- no tone-gradient colors, flat rgba fills and var(--line) borders only."
  process:
    - "Follow the local phased workflow in personal-site's own .agents/ -- this feature's docs live under personal-site/docs/design-handoff-2026-08/, separate from the sibling cfb-rankings repo's docs/."
    - "Execution should batch by complexity: simple polish pages (Home/About/Now/Projects hub) as one batch, and the CFB Rankings + Methodology rework (which share a header pattern and the data-wiring work) as a second, more involved batch. 2020 Election Model can go with either batch given its similar but independent scope."

assumptions:
  - "personal-site's production domain/Pages project is manageable by the user via the Cloudflare dashboard (for creating the deploy hook and setting build environment variables) -- these are manual steps the user does, not something an agent can do autonomously, consistent with the R2 bucket provisioning pattern already established in the sibling cfb-rankings work this session."
  - "cfb-rankings' weekly-update.yml (in the sibling repo) will need a small addition -- a curl POST to the new deploy hook URL as the final step -- to actually trigger rebuilds automatically. This is a small cross-repo follow-up, not part of this feature's own execution scope (this feature lives in personal-site), but must be called out clearly as a required follow-up action."
  - "R2's free tier (already confirmed generous during the cfb-rankings artifact-output work) comfortably covers the additional read traffic from personal-site's builds (one read of index.json + up to ~15-20 per-week files per build, at most a few builds/week)."

