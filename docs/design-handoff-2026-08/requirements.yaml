    - "public/data/cfb/latest-rankings.json (to be superseded)"
  systems_in_scope:
    - "Astro static build pipeline (personal-site)"
    - "Cloudflare Pages (build env vars, deploy hooks)"
    - "Cloudflare R2 (read-only access, already populated by sibling cfb-rankings repo)"
  prior_artifacts:
    - "None in personal-site/docs/ yet for this feature."
    - "Sibling repo cfb-rankings has docs/rankings-artifact-output/ and docs/rankings-artifact-index/ (the R2 publishing work this feature consumes) and docs/cfb-site-migration/requirements.yaml (broader migration context, not authoritative for this feature's own scope)."

research:
  repo_findings:
    - "Several design-handoff README items are already implemented in current code -- treated as no-ops: Home's 5 tile hrefs, About's back-link + now-page inline link, Now's back-link + about-page inline link, Projects hub's back-link are all already correct (no # placeholders). Projects hub's 'whole card clickable' behavior for CFB Rankings/Election tiles already works via CSS z-index-layered sibling anchors (.tile-overlay + .icon-link), not a JS click-handler -- no <a>-nesting violation exists today. The 2020 Election Model's map image is a real existing asset already correctly wired in, not a placeholder."
    - "Real remaining work for the 4 polish pages: Home (remove 1-line 'Featured' eyebrow), About (add missing :hover rules to .fact-card/.about-card referencing the already-global --shadow-hover token; remove .hero-text max-width:42rem; adjust .about-shell padding-bottom -- exact target value to be confirmed against about.html reference during planning/execution, README's '3.5rem' is ambiguous as replace-vs-add to the current 1.5rem), Now (remove .hero-text max-width:40rem), Projects hub (new bordered-chip logo CSS replacing the current borderless project-mark-frame; :has() padding-right on .tile-summary; remove .footer-line divs+CSS; add missing .icon-link:hover)."
    - "cfb-rankings.astro currently reads a local static file (public/data/cfb/latest-rankings.json, only 3 sample rows, no conference field) via readFileSync -- this entire data-sourcing approach is replaced by build-time R2 fetching."
    - "RankingsTable.astro is fully generic and Conference-column-ready with minor care needed around the td:not(:nth-child(2)) mono-font CSS coupling and the accent-football rank-col color (must neutralize)."
    - "methodology.astro's exact before/after vertical-rhythm CSS values were captured in full during discovery (section spacing, line-height 1.85->1.5, heading sizes, content padding, list spacing) -- available for the execution handoff."
    - "2020-election-model.astro's .hero-text should have its max-width removed (matching About/Now), NOT copy the reference HTML's white-space:nowrap/overflow-x:auto treatment, which looks like a design-preview-only quirk inconsistent with the README's stated intent."
  platform_findings:
    - "personal-site is confirmed 100% static: no `output` field in astro.config.mjs (defaults to static), no adapter package, zero API routes, zero env-var usage, zero precedent for external/authenticated fetching anywhere in the codebase. Confirmed no .github/workflows/ or wrangler.toml -- deploys via Cloudflare Pages' native git-connected build."
    - "Four R2 access options researched: (1) r2.dev Public Development URL -- Cloudflare's own docs explicitly discourage it beyond dev/testing, no caching/WAF, undocumented rate limit; (2) custom domain -- Cloudflare's recommended production path for a PUBLIC bucket, requires the domain to be an active zone in the same Cloudflare account as the bucket, unlocks edge caching/WAF; (3) Pages Functions + private R2 binding -- fully private bucket, live per-request reads, but requires adding the @astrojs/cloudflare adapter and one on-demand (prerender:false) route, i.e. the site's first non-static route; (4) build-time authenticated fetch via R2's S3-compatible API with a scoped read-only token -- site stays 100% static, bucket stays fully private, freshness = last deploy. USER CHOSE OPTION 4."
    - "Cloudflare Pages Deploy Hooks: created per-project (Settings -> Builds -> Add deploy hook), yields a URL that triggers a rebuild on a plain unauthenticated HTTP POST (secrecy of the URL itself is the only protection, per Cloudflare's own docs -- treat it as a secret). This is the standard mechanism for external systems to trigger a Pages rebuild after publishing new content, and directly satisfies the need for cfb-rankings' weekly publish to trigger a personal-site rebuild."

acceptance_criteria:
  - "All 7 pages visually match the locked design reference (README.md + corresponding .html file) for every item that discovery confirmed is not already a no-op."
  - "The Rankings page's table renders the full field (not a 3-row sample) for whichever season/week is selected, with a working Season and Week dropdown that switches between pre-baked datasets client-side."
  - "The Rankings page's table includes a Conference column, correctly placed so existing mono-font CSS targeting still applies to the intended columns."
  - "No new server-side route, adapter, or env-var-at-request-time dependency is introduced -- the site remains buildable with a plain `astro build` and no Cloudflare Functions runtime involved for any existing or new route."
  - "R2 credentials used by the build are read-only scoped and distinct from cfb-rankings' write-scoped token."
  - "A Cloudflare Pages deploy hook exists for personal-site, and the required follow-up (adding a curl POST step to cfb-rankings' weekly-update.yml) is clearly documented as a next action even though it's out of this feature's own execution scope."

open_questions:
  - "Exact --about-shell padding-bottom target value (README's '3.5rem' vs current 1.5rem, replace-or-add ambiguity) -- to be resolved by checking about.html's literal computed value during execution, not a blocking planning question."
  - "Whether the Projects hub's already-working card-click behavior has a real keyboard-accessibility gap (overlay-link and icon-link as separate tab stops, no single 'whole card' focus target) worth addressing as a stretch item, or whether the README's JS-click-handler instruction is simply moot against current code -- treated as a no-op for this feature's core scope; flagged as an optional, non-blocking nice-to-have for planning to decide whether to include."

freeze:
  ready_for_plan: true
  blockers: []
