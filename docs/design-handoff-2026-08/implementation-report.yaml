open_issues:
  - "REQUIRED before this goes live in production: user must provision (1) a new READ-ONLY-scoped Cloudflare R2 API token, distinct from cfb-rankings' write token, (2) Cloudflare Pages build environment variables (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID_READONLY, R2_SECRET_ACCESS_KEY_READONLY, R2_BUCKET_NAME) for the personal-site Pages project, and (3) a Cloudflare Pages Deploy Hook. These are manual, dashboard-only steps -- no agent can do them. Until provisioned, the site will build fine (T2's fetch script gracefully skips with a warning) but the Rankings page will have no data source at all (public/data/cfb/ won't exist), since T3's page reads that directory via readFileSync with no fallback -- this WILL break the build in a real Cloudflare Pages deploy until credentials are added, unlike local dev where a developer might have manually seeded sample data."
  - "SEPARATE, cross-repo follow-up (not part of this feature's own scope): the sibling cfb-rankings repo's weekly-update.yml needs a new final step added -- a curl POST to the new Cloudflare Pages deploy hook URL -- so that repo's weekly rankings publish actually triggers a personal-site rebuild. Without this, the deploy hook exists but nothing calls it, and the Rankings page's data will only refresh whenever personal-site happens to be redeployed for an unrelated reason."
  - "Noted, not addressed: the Projects hub's keyboard-accessibility gap (two separate tab stops for the whole-card link) was verified as low-risk (aria-label correct, default focus outline intact) but not structurally fixed -- a real fix would require restructuring the overlay/icon-link split-anchor mechanism, judged out of this pass's bounded scope per the plan's own escalation guidance."

handoff:
