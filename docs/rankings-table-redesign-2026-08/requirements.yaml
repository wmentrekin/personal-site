artifact: requirements
feature: "rankings-table-redesign-2026-08"
mode: "bounded-feature"
status: draft
owner_skill: work

summary:
  problem: >
    The Rankings table (RankingsTable.astro, used only on /projects/cfb-rankings) has
    three concrete design problems the user identified column-by-column: cell text
    isn't visually aligned under its column header, the Team column shows only a name
    with no logo even though the source DB has logo URLs, and there's no clear visual
    separation between rows.
  motivation: >
    This is the last main desktop design task before Phase 3 (page freeze) per
    docs/roadmap-to-launch.md's "next on this page" note. Paired with cfb-rankings'
    rankings-artifact-fixes-2026-08, which adds the `logo` field and standardizes the
    `conference` field this feature needs in the artifact schema -- this feature's
    logo rendering has no real data to show until that one lands.
  requested_outcome: >
    Rank/Record/Rating/Delta columns read as clearly numeric and aligned under their
    headers, Team/Conference read as clearly text and left-aligned; the Team column
    shows a small team logo next to the team name; rows have a clear, intentional
    visual rhythm/separation instead of a barely-visible 6%-opacity border.

goals:
  - "Explicit per-column text-align for all 6 columns (Rank/Record/Delta centered, Rating right-aligned as a numeric value, Team/Conference left-aligned as text), applied identically to th and td so header and cell content line up."
  - "Render '[logo] Team Name' in the Team column: extend RankingsTable's row-cell type to accept an optional {logo, name} object (in addition to today's string|number), rendered as a small <img> + name; falls back to name-only text if logo is null."
  - "Wire the new artifact `logo` field through cfb-rankings.astro's SSR row-building AND its client-side season/week-switcher's renderRows() -- both paths must stay in sync (this repo's existing pattern for that page)."
  - "Allow the logo host (cdn.collegefootballdata.com) in public/_headers' CSP img-src -- currently `img-src 'self' data:` only, which would silently block every logo image in production. Single, narrowly-scoped host addition, same pattern already used for cdn.jsdelivr.net/fonts.gstatic.com."
  - "Design and implement clearer inter-row visual separation (stronger border-bottom contrast, slightly more vertical padding, subtle zebra tint on even rows) consistent with the site's existing glass-card/rgba-overlay visual language -- no new design tokens invented."

non_goals:
  - "The Rankings table's mobile stacked-card layout -- still deferred to a dedicated future session per the existing decision recorded in design-handoff-mobile-2026-08/status.yaml. This feature is desktop-table styling only."
  - "Any change to what data the table shows or how season/week selection works -- purely visual/structural table changes plus the logo plumbing."
  - "Standardizing conference display strings -- that happens upstream in the artifact (cfb-rankings' rankings-artifact-fixes-2026-08); this feature just renders whatever `conference` string the artifact provides."

constraints:
  technical:
    - "RankingsTable.astro is used in exactly one place (grep-confirmed: only src/pages/projects/cfb-rankings.astro) -- its prop contract can be safely extended without a compatibility shim."
    - "The client-side renderRows() in cfb-rankings.astro currently builds cells via textContent only (deliberately, to avoid innerHTML injection from fetched JSON) -- the logo cell must be built the same DOM-safe way (createElement for <img>, not string concatenation)."
    - "This site has no light/dark theme toggle (grep-confirmed, single dark theme) -- use the CFBD 'logos-dark' (light-colored, dark-background-optimized) variant, not the default 'logos' variant."
    - "No live browser is available in this environment (same limitation as design-handoff-mobile-2026-08) -- validation is build output + source review + a synthetic local data fixture, not visual. A real device/browser pass is expected afterward, same as the prior mobile feature."
  product:
    - "Row-separation and exact alignment choices are a design judgment call made without a fresh mockup (the user asked to 'design the space of each row' rather than specifying it) -- flagged to the user as such rather than treated as spec."
  process:
    - "Depends on cfb-rankings' rankings-artifact-fixes-2026-08 landing first for real logo URLs/standardized conference strings to exist in R2; this feature's code can be built and structurally validated against a synthetic fixture in the meantime, but won't show correct real data until that feature's backfill runs."

assumptions:
  - "A ~20px logo image next to the team name is an appropriate size for this table's existing compact row height (~0.9rem font, ~0.72rem vertical padding)."

repo_context:
  relevant_paths:
    - "src/components/RankingsTable.astro"
    - "src/pages/projects/cfb-rankings.astro (SSR rows mapping + client-side renderRows())"
    - "public/_headers (CSP img-src)"
  systems_in_scope: ["static Astro build", "public/data/cfb/ build-time artifact fetch"]
  prior_artifacts:
    - "docs/design-handoff-mobile-2026-08/ (prior related feature; explicitly deferred the Rankings table's mobile layout, recorded there as still owed)"

research:
  repo_findings:
    - "RankingsTable.astro currently has no explicit text-align rules at all (browser default left for both th/td) -- misalignment the user sees is a design gap, not a bug to reverse-engineer."
    - "grep confirms RankingsTable is used in exactly one page -- safe to extend its cell type without back-compat concerns."
    - "public/_headers CSP img-src is `'self' data:` only -- would silently block cdn.collegefootballdata.com logo images if added without a CSP update. Caught via direct read before implementation, not left to be discovered as a production bug."
    - "cfb-rankings.astro has two separate row-building code paths (SSR initial render, client-side renderRows() for the season/week switcher) that must both be updated identically or the two will visually diverge after a user changes the week selector."

acceptance_criteria:
  - "Rank/Record/Delta columns render centered, Rating right-aligned, Team/Conference left-aligned, both in the header row and every data row."
  - "Team column shows a small logo image immediately before the team name when the artifact's `logo` field is non-null, and just the name (unchanged from today) when it's null."
  - "Switching season/week via the client-side selectors re-renders logos correctly (not just on initial page load)."
  - "npm run build and npx astro check both pass with 0 errors after the CSP img-src change and the component/page edits."
  - "A synthetic local fixture week JSON (with a couple of teams carrying real cdn.collegefootballdata.com logo URLs and standardized conference strings) renders correctly in the built HTML output, confirmed via source inspection since no live browser is available."

open_questions: []

ready_for_planning: true
planning_blockers: []
