decisions:
  - question: "How is batch 2 sequenced, given agents share one working tree?"
    answer: >
      In waves rather than fully parallel. Nearly every task touches
      src/pages/projects/cfb-rankings/index.astro or src/components/ScheduleGrid.astro, and
      concurrent agents would clobber each other. Wave 1 is the CSS work in the two
      components; wave 2 the Rankings table reorder and delta glyphs; wave 3 titles, copy,
      asterisk and the conference filter; wave 4 rank and division rendering.
  - question: "How will rank and division rendering be verified before the site rebuilds?"
    answer: >
      Against a fixture built from real database values, because this sandbox's proxy blocks
      pages.dev so the freshly published artifact cannot be fetched. Final confirmation is
      against the real artifact once Cloudflare rebuilds. Recorded so the fixture is not
      mistaken for the real thing.

